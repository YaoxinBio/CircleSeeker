name: circleseeker
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip>=23
  - click>=8.1
  - pandas>=2.0
  - numpy>=1.23
  - biopython>=1.81
  - pysam>=0.22
  - pyyaml>=6.0
  - networkx>=3.0
  - packaging>=23
  - intervaltree>=3.1
  - pybedtools>=0.9
  - mappy>=2.26
  - tidehunter>=1.4
  - minimap2>=2.24
  - samtools>=1.17
  - cd-hit>=4.8.1
  - last>=1250
